# grizly on a server (Coolify, docker compose, or plain docker).
#
#   cp .env.example .env        # fill CLAUDE_CODE_OAUTH_TOKEN and GRIZLY_UI_PASSWORD
#   docker compose up -d        # web UI on :8000 — run everything from the browser
#
# The service is the web UI. It starts nothing by itself: a deploy never runs a
# paid step, a person presses the button. The terminal still works too:
#   docker compose run --rm grizly selftest
#   docker compose run --rm grizly enrich --in grizly.csv --limit 10 --dry-run

services:
  grizly:
    build:
      context: .
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.330}
    image: grizly:2.0
    # The UI is a service; the batches it starts are its child processes.
    restart: unless-stopped
    init: true
    environment:
      # --- needed for enrich (the paid step); pull/classify/import run without ---
      # Claude subscription token (`claude setup-token`). The ONLY credential:
      # an API key is never passed to `claude -p`, even if one is set.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # --- web UI login (user defaults to peakflow) ---
      GRIZLY_UI_USER: ${GRIZLY_UI_USER:-peakflow}
      GRIZLY_UI_PASSWORD: ${GRIZLY_UI_PASSWORD:-}
      # --- optional ---
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      GRIZLY_PROFILE: ${GRIZLY_PROFILE:-peakflow}
      GRIZLY_MODEL: ${GRIZLY_MODEL:-sonnet}
      GRIZLY_WORKERS: ${GRIZLY_WORKERS:-3}
      GRIZLY_BUDGET: ${GRIZLY_BUDGET:-0.15}
      GRIZLY_VERIFY_MODEL: ${GRIZLY_VERIFY_MODEL:-sonnet}
      GRIZLY_VERIFY_BUDGET: ${GRIZLY_VERIFY_BUDGET:-0.30}
      # Czech dates in enriched_at / found_on
      TZ: ${TZ:-Europe/Prague}
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    volumes:
      # CSV, contacts, cache, cost log and the suppression lists survive a run.
      # The entrypoint fixes the owner once; nothing to chown by hand.
      - ./data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    # A redeploy stops the UI; SIGINT lets a running batch write what it has
    # (grizly also flushes every 10 companies, and the next run resumes).
    stop_grace_period: 60s
    stop_signal: SIGINT
    command: ["ui", "--port", "8000"]
